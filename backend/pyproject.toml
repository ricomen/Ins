[project]
name = "ins-backend"
version = "0.0.1"
description = "Instagram media downloader service"
requires-python = ">=3.12"
dependencies = [
    "arq>=0.26",
    "asyncpg>=0.30",
    "fastapi>=0.115",
    "httpx>=0.27",
    "instaloader>=4.16",
    "pyjwt>=2.9",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "python-socketio[asyncio_client]>=5.11",
    "redis>=5.0",
    "sqlalchemy[asyncio]>=2.0",
    "uvicorn[standard]>=0.30",
]

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "ruff>=0.6",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
